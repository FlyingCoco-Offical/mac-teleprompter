<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Teleprompter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
    }
    .controls {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: rgba(20, 20, 20, 0.9);
      -webkit-app-region: no-drag;
    }
    button {
      background: #007aff;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #0056b3; }
    #scriptInput {
      width: 100%;
      height: 70px;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #333;
      padding: 6px;
      border-radius: 4px;
      resize: none;
      -webkit-app-region: no-drag;
    }
    #displayArea {
      flex: 1;
      overflow-y: auto;
      padding: 100px 20px;
      font-size: 24px;
      line-height: 1.6;
      scroll-behavior: smooth;
      -webkit-app-region: no-drag;
    }
    .word {
      opacity: 0.4;
      transition: opacity 0.2s, color 0.2s;
    }
    .word.active {
      opacity: 1;
      color: #00ff66;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="toggleBtn">Load Script</button>
    <button id="micBtn">Start Voice Tracking</button>
  </div>

  <div class="controls">
    <textarea id="scriptInput" placeholder="Paste your script here..."></textarea>
  </div>

  <div id="displayArea"></div>

  <script>
    const scriptInput = document.getElementById('scriptInput');
    const displayArea = document.getElementById('displayArea');
    const toggleBtn = document.getElementById('toggleBtn');
    const micBtn = document.getElementById('micBtn');

    let wordsArray = [];
    let wordElements = [];
    let currentIndex = 0;
    let recognition = null;
    let isListening = false;

    toggleBtn.addEventListener('click', () => {
      const text = scriptInput.value.trim();
      if (!text) return;

      displayArea.innerHTML = '';
      wordsArray = text.split(/\s+/);
      wordElements = [];
      currentIndex = 0;

      wordsArray.forEach((word) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = word + ' ';
        displayArea.appendChild(span);
        wordElements.push(span);
      });

      if (wordElements.length > 0) {
        wordElements[0].classList.add('active');
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        const spokenWords = transcript.toLowerCase().replace(/[^\w\s]/g, '').trim().split(/\s+/);
        const latestSpoken = spokenWords[spokenWords.length - 1];

        if (latestSpoken && currentIndex < wordsArray.length) {
          for (let lookahead = 0; lookahead <= 3; lookahead++) {
            const targetIdx = currentIndex + lookahead;
            if (targetIdx < wordsArray.length) {
              const checkWord = wordsArray[targetIdx].toLowerCase().replace(/[^\w\s]/g, '');
              if (checkWord === latestSpoken) {
                updatePosition(targetIdx);
                break;
              }
            }
          }
        }
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };
    }

    function updatePosition(newIndex) {
      if (wordElements[currentIndex]) {
        wordElements[currentIndex].classList.remove('active');
      }
      currentIndex = newIndex;
      if (wordElements[currentIndex]) {
        const activeEl = wordElements[currentIndex];
        activeEl.classList.add('active');

        const containerTop = displayArea.getBoundingClientRect().top;
        const elementTop = activeEl.getBoundingClientRect().top;
        const offset = elementTop - containerTop - (displayArea.clientHeight / 2);
        
        displayArea.scrollBy({ top: offset, behavior: 'smooth' });
      }
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('Speech recognition is not supported in this environment.');
        return;
      }

      if (!isListening) {
        recognition.start();
        isListening = true;
        micBtn.textContent = 'Stop Voice Tracking';
        micBtn.style.background = '#ff3b30';
      } else {
        recognition.stop();
        isListening = false;
        micBtn.textContent = 'Start Voice Tracking';
        micBtn.style.background = '#007aff';
      }
    });
  </script>
</body>
</html>
